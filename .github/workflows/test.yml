# The tests exist; this is what makes them mean something.
#
# Most of the suite needs the five protocol documents, which are not in this
# repository and are not ours to publish — those cases skip. What runs here is
# the held-out mock we wrote ourselves, which is enough to prove the pipeline
# loads, reads a 97-page PDF, and still finds the eighteen columns and
# twenty-nine rows it is supposed to. A reviewer with the protocols beside the
# checkout gets the full suite from the same command.
#
# Two Node versions, and both have already earned their place. The first run
# here failed on the test command: `node --test "test/*.test.mjs"` passes
# locally, where the shell leaves the quoted glob alone and Node expands it, and
# fails on Linux, where Node is handed a path with a star in it. The second
# failed on Node 20, which has no `Promise.withResolvers` — pdfjs-dist calls it,
# so the minimum this project claimed to support was simply wrong, and nothing
# said so because npm does not enforce `engines`. Neither fault would have shown
# up on a single version.
name: tests

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node: [22, 24]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm ci
      - run: npm test
